// Arma 2: Operation Arrowhead -- server.cfg
// https://community.bistudio.com/wiki/Arma_2:_Server_Config_File
//
// Values marked "managed" are rewritten from egg variables by Pterodactyl's config parser on
// every boot. Editing them here is pointless -- change the variable in the panel instead.
// Everything else is yours to edit and is never touched.

// The six settings below are rewritten on every boot. Comments must live on their own lines
// here, not trailing the values: the parser replaces whole lines, so a trailing comment would
// silently disappear the first time the server started.

// managed: SERVER_NAME
hostname = "Arma 2 OA Server";
// managed: SERVER_PASSWORD -- join password, empty = public
password = "";
// managed: ADMIN_PASSWORD -- the #login password
passwordAdmin = "changeme";
// managed: MAX_PLAYERS
maxPlayers = 64;
// managed: VERIFY_SIGNATURES
verifySignatures = 2;
// managed by boot.sh, NOT by the panel parser: DISABLE_BATTLEYE decides this, inverted.
// See the README -- one variable owns BattlEye, server.cfg and beserver.cfg together.
BattlEye = 0;

logFile = "server_console.log";
motd[] = {
    "Arma 2: Operation Arrowhead"
};
motdInterval = 5;

// Signature / file integrity.
// verifySignatures = 2 requires every loaded addon to be signed AND its .bikey present in
// keys/. boot.sh syncs keys out of each -mod folder on startup, so mods that ship keys work
// without manual copying. Set VERIFY_SIGNATURES=0 only for local testing.
allowedFilePatching = 1;

// Player timeouts and network kicks.
disconnectTimeout = 90;
maxDesync = 150;
maxPing = 500;
maxPacketLoss = 50;
kickDuplicate = 1;

// Voting. 0 disables mission voting entirely; raise if you want players to pick missions.
voteMissionPlayers = 3;
voteThreshold = 0.33;

// Voice.
disableVoN = 0;
vonCodecQuality = 10;

// Persistence. 1 keeps the mission running when the last player leaves.
persistent = 1;

timeStampFormat = "short";

// Mission rotation. An empty Missions class means no rotation -- the server idles in the
// lobby until an admin selects a mission, which is what a mod-driven server usually wants.
// DayZ Mod and similar set their world with -world= and supply their own mpmissions entry.
class Missions {};
