// Arma 2: Operation Arrowhead -- basic.cfg (network tuning)
// https://community.bistudio.com/wiki/Arma_2:_Basic_Server_Config_File
//
// Nothing here is managed by the egg -- these are yours to tune. The values below are the
// commonly used defaults for a dedicated server on a decent connection, not the engine's own
// defaults, which are conservative enough to cause desync on modern links.

MinBandwidth = 131072;
MaxBandwidth = 1000000000;

MaxMsgSend = 256;
MaxSizeGuaranteed = 512;
MaxSizeNonguaranteed = 256;

MinErrorToSend = 0.003;
MinErrorToSendNear = 0.01;

// Cap on object view distance the server will stream, in metres. Lower it if the server is
// CPU-bound with many players.
MaxCustomFileSize = 0;

class sockets {
    maxPacketSize = 1400;
};
