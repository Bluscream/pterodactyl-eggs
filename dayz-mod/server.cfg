// DayZ Mod (Arma 2: Operation Arrowhead) -- cfgdayz/server.cfg
// https://community.bistudio.com/wiki/Arma_2:_Server_Config_File
//
// Comments for managed settings sit on their OWN lines above them: Pterodactyl's file parser
// replaces whole lines, so a trailing comment would vanish on first boot.

// managed: SERVER_NAME
hostname = "DayZ Mod Server";
// managed: SERVER_PASSWORD -- join password, empty = public
password = "";
// managed: ADMIN_PASSWORD -- the #login password
passwordAdmin = "changeme";
// managed: MAX_PLAYERS
maxPlayers = 50;
// managed: VERIFY_SIGNATURES
verifySignatures = 2;
// managed: REQUIRED_BUILD
requiredBuild = 108074;
// managed by boot.sh, NOT the panel parser: DISABLE_BATTLEYE owns this, inverted.
BattlEye = 0;

logFile = "server.log";

motd[] = {
    "DayZ Mod"
};
motdInterval = 5;

kickDuplicate = 1;
equalModRequired = 0;
persistent = 1;
timeStampFormat = "short";

// Voting. DayZ Mod servers normally run one fixed mission, so keep this minimal.
voteMissionPlayers = 1;
voteThreshold = 2;

disableVoN = 0;
vonCodecQuality = 10;

// Anti-tamper responses. Kicking on unsigned or hacked data is the point of verifySignatures.
onUserConnected = "";
onUserDisconnected = "";
doubleIdDetected = "";
onUnsignedData = "kick (_this select 0)";
onHackedData = "kick (_this select 0)";
onDifferentData = "";

// The mission. dayz_1.chernarus is what the Linux server layout ships in mpmissions/.
// Changing the map means supplying a matching mission pbo AND setting WORLD to match.
class Missions
{
    class DayZ {
        template = dayz_1.chernarus;
        difficulty = "veteran";
    };
};
